[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isobake"
version = "0.2.0"
description = "Bake unattended Ubuntu install ISOs for machines with no PXE server: presets, per-device credentials, fleet builds, QEMU boot test."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abhyuday Samadder" }]
keywords = ["ubuntu", "autoinstall", "iso", "cloud-init", "provisioning", "subiquity", "unattended", "usb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
isobake = "isobake.cli:main"

[project.urls]
Homepage = "https://github.com/Abhyuday98/isobake"
Issues = "https://github.com/Abhyuday98/isobake/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isobake = ["presets/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
