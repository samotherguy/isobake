autoinstall:
  late-commands:
    - curtin in-target -- apt-get install -y clevis clevis-luks clevis-tpm2 clevis-initramfs tpm2-tools
    - |
      set -e
      [ -w /dev/console ] && exec >/dev/console 2>&1
      dev=$(blkid -t TYPE=crypto_LUKS -o device | head -1)
      [ -n "$dev" ] || { echo "tpm-unlock: no LUKS device found; add the encrypted-disk preset" >&2; exit 1; }
      [ -e /dev/tpmrm0 ] || { echo "tpm-unlock: no TPM 2.0 found (/dev/tpmrm0 missing)" >&2; exit 1; }
      printf '%s' '${luks_passphrase}' > /target/root/isobake-luks.key
      curtin in-target -- clevis luks bind -y -k /root/isobake-luks.key -d "$dev" tpm2 '{"pcr_bank":"sha256","pcr_ids":"7"}'
      shred -u /target/root/isobake-luks.key
      curtin in-target -- update-initramfs -u -k all
  user-data:
    runcmd:
      - find /var/log/installer -type f -exec shred -u {} + 2>/dev/null || true
