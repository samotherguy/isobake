autoinstall:
  late-commands:
    - |
      set -e
      [ -w /dev/console ] && exec >/dev/console 2>&1
      key=/dev/disk/by-label/linux-key
      [ -e "$key" ] || { echo "usb-keyfile: no partition labelled linux-key; plug the key stick in during install" >&2; exit 1; }
      dev=$(blkid -t TYPE=crypto_LUKS -o device | head -1)
      [ -n "$dev" ] || { echo "usb-keyfile: no LUKS device found; add the encrypted-disk preset" >&2; exit 1; }
      mkdir -p /mnt/linux-key && mount "$key" /mnt/linux-key
      [ -s /mnt/linux-key/linux.key ] || dd if=/dev/urandom of=/mnt/linux-key/linux.key bs=256 count=1 status=none
      chmod 0400 /mnt/linux-key/linux.key
      printf '%s' '${luks_passphrase}' > /run/isobake-luks.key
      cryptsetup luksAddKey --key-file /run/isobake-luks.key "$dev" /mnt/linux-key/linux.key
      rm -f /run/isobake-luks.key
      umount /mnt/linux-key
      sed -i 's#\bnone\b#/dev/disk/by-label/linux-key:/linux.key:10#; s/\(luks[^ ]*\)$/\1,keyscript=\/lib\/cryptsetup\/scripts\/passdev/' /target/etc/crypttab
      curtin in-target -- update-initramfs -u -k all
  user-data:
    runcmd:
      - find /var/log/installer -type f -exec shred -u {} + 2>/dev/null || true
