name: publish

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted
# publishing (OIDC), so no token is stored anywhere. One-time setup on PyPI:
# project isobake, Publishing, add GitHub publisher: owner samotherguy,
# repository isobake, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
